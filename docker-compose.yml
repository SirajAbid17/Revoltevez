services:
 
  mongo:
    image: mongo:7
    container_name: taskflow-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - taskflow-network

  
  redis:
    image: redis/redis-stack-server:latest
    container_name: taskflow-redis
    command:
      [
        "sh",
        "-c",
        "echo 'Starting Redis Server' && redis-server"
      ]
    ports:
      - "6379:6379"
    networks:
      - taskflow-network

  
  backend-1:
    build: ./backend
    container_name: taskflow-backend-1
    environment:
      - PORT=5000
      - SERVER_ID=backend-1
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017/revoltevez
    depends_on:
      - redis
      - mongo
    networks:
      - taskflow-network

  
  backend-2:
    build: ./backend
    container_name: taskflow-backend-2
    environment:
      - PORT=5000
      - SERVER_ID=backend-2
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017/revoltevez
    depends_on:
      - redis
      - mongo
    networks:
      - taskflow-network

 
  backend-3:
    build: ./backend
    container_name: taskflow-backend-3
    environment:
      - PORT=5000
      - SERVER_ID=backend-3
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017/revoltevez
    depends_on:
      - redis
      - mongo
    networks:
      - taskflow-network

  
  nginx:
    image: nginx:alpine
    container_name: taskflow-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - taskflow-network


volumes:
  mongo-data:


networks:
  taskflow-network:
    driver: bridge